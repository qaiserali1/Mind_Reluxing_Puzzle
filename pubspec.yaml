name: rake
description: "A meditative zen sand garden mobile game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  easy_localization: ^3.0.3
  shared_preferences: ^2.2.3
  google_mobile_ads: ^5.0.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  audioplayers: ^6.0.0
  vibration: ^2.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  # Phase 3 Enhancements
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  games_services: ^4.1.0
  home_widget: ^0.7.0
  app_links: ^6.3.1
  in_app_review: ^2.0.9
  # Phase 4 Multi-Platform & Export Enhancements
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/audio/
    - assets/metadata/
